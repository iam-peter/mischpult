name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Native engine tests
        run: ./native-tests/run.sh

      - name: Unit tests
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest

      - name: Signing key
        # Only on pushes to this repository: pull requests from forks get no secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.MISCHPULT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MISCHPULT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        env:
          MISCHPULT_KEYSTORE_PASSWORD: ${{ secrets.MISCHPULT_KEYSTORE_PASSWORD }}
          MISCHPULT_KEY_ALIAS: ${{ secrets.MISCHPULT_KEY_ALIAS }}
          MISCHPULT_KEY_PASSWORD: ${{ secrets.MISCHPULT_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleRelease

      - name: Name APKs
        run: |
          sha=$(git rev-parse --short HEAD)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/mischpult-debug-$sha.apk"
          release=$(ls app/build/outputs/apk/release/*.apk | head -1)
          case "$release" in
            *unsigned*) cp "$release" "out/mischpult-release-unsigned-$sha.apk" ;;
            *) cp "$release" "out/mischpult-$sha.apk" ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: mischpult-apks
          path: out/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
