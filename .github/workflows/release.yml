name: Release

# Push a tag like v0.1.0 (matching versionName in app/build.gradle.kts) to
# build a signed APK and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: |
          ./native-tests/run.sh
          ./gradlew --no-configuration-cache :app:testDebugUnitTest

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MISCHPULT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The MISCHPULT_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MISCHPULT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          MISCHPULT_KEYSTORE_PASSWORD: ${{ secrets.MISCHPULT_KEYSTORE_PASSWORD }}
          MISCHPULT_KEY_ALIAS: ${{ vars.MISCHPULT_KEY_ALIAS }}
          MISCHPULT_KEY_PASSWORD: ${{ secrets.MISCHPULT_KEY_PASSWORD }}
        run: |
          ./gradlew --no-configuration-cache :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "mischpult-${GITHUB_REF_NAME#v}.apk"
          sha256sum mischpult-*.apk > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mischpult-*.apk SHA256SUMS \
            --title "Mischpult ${GITHUB_REF_NAME#v}" --generate-notes
